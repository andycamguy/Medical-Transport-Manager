<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMH Scheduler — Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
<main class="login-shell">
  <section class="login-card">
    <div class="login-brand"><span>CMH</span><small>MEDICAL TRANSPORTATION</small></div>
    <h1>Scheduler Login</h1>
    <p class="muted">Sign in to access the CMH transportation schedule.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button primary" type="submit">LOG IN</button>
    </form>
  </section>
</main>
</body>
</html>
